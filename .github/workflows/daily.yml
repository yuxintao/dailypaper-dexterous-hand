name: Daily Paper Recommendation

on:
  schedule:
    - cron: "0 0 * * *"       # Every day at 00:00 UTC (rely on script to skip weekends)
    - cron: "0 12 * * 1-5"   # Mon-Fri at 12:00 UTC (backup: 20:00 Beijing)
  workflow_dispatch:          # Allow manual trigger

permissions:
  contents: write
  issues: write

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pyyaml openai

      - name: Run daily recommendation
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python scripts/daily_rec.py

      - name: Create GitHub Issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          Y=$(date +%Y)
          M=$(date +%m)
          D=$(date +%d)
          FILE="papers/${Y}/${M}/${M}${D}.md"
          if [ -f "$FILE" ]; then
            TITLE=$(head -1 "$FILE" | sed 's/^# //')
            # Check by date label to avoid Chinese character matching issues
            DATE_LABEL="${Y}${M}${D}"
            EXISTING=$(gh issue list --search "每日推荐 in:title ${TODAY}" --json number -q '.[0].number' 2>/dev/null)
            if [ -z "$EXISTING" ]; then
              # Also try simpler search with just the date
              EXISTING=$(gh issue list --search "${TODAY} in:title" --json number -q '.[0].number' 2>/dev/null)
            fi
            if [ -z "$EXISTING" ]; then
              gh issue create \
                --title "[每日推荐] ${TITLE}" \
                --body "$(cat "$FILE")"
              echo "Issue created successfully."
            else
              echo "Issue already exists (#${EXISTING}). Skipping."
            fi
          else
            echo "No paper file found at $FILE. Skipping issue creation."
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add papers/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🤖 Daily rec: $(date +%Y-%m-%d)"
            git push origin main
          fi
