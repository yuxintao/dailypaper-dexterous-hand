name: Daily Paper Recommendation

on:
  schedule:
    - cron: "0 0 * * 1-5"  # Mon-Fri at 00:00 UTC (08:00 Beijing)
  workflow_dispatch:        # Allow manual trigger

jobs:
  recommend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run daily recommendation
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/daily_rec.py

      - name: Create GitHub Issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const today = new Date();
            const y = today.getFullYear();
            const m = String(today.getMonth() + 1).padStart(2, '0');
            const d = String(today.getDate()).padStart(2, '0');
            const filePath = `papers/${y}/${m}/${m}${d}.md`;
            if (fs.existsSync(filePath)) {
              const content = fs.readFileSync(filePath, 'utf8');
              const title = content.split('\n')[0].replace('# ', '');
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[每日推荐] ${title}`,
                body: content.substring(0, 60000),
                labels: ['daily-recommendation']
              });
            }

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add papers/ reports/ INDEX.md
          git diff --staged --quiet || git commit -m "🤖 Daily rec: $(date +%Y-%m-%d)"
          git push
